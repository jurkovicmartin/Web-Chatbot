<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepseek Web Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-light sidebar vh-100 p-3">
                <h4>Saves</h4>
                <ul class="nav flex-column">
                    {% for name, _ in chat_saves %}
                        <li class="nav-item">
                            <form action="/saves" method="POST" class="d-flex">
                                <input type="hidden" name="save_name" value="{{ name }}">
                                <button type="submit" name="action" value="load" class="btn btn-link text-light">{{ name }}</button>
                                <button type="button" class="btn btn-sm btn-success ms-2 rename-btn" data-bs-toggle="modal" data-bs-target="#renameModal" data-oldname="{{ name }}">Rename</button>
                                <button type="submit" name="action" value="delete" class="btn btn-sm btn-danger ms-2">X</button>
                            </form>
                        </li>
                    {% endfor %}
                    
                    <li class="nav-item">
                        <form action="/export" method="POST">
                            <button type="submit">Export saves</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form action="/upload" method="post" enctype="multipart/form-data">
                            <label for="file"><h5>Load save</h5></label>
                            <input type="file" name="file" id="file" accept=".json">
                            <button type="submit">Load save</button>
                        </form>
                    </li>
                </ul>
            </nav>
            <!-- Main -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <h1 class="text-center">Deepseek Web Client</h1>

                <form method="POST" class="mb-3">
                    <label for="text_input" class="form-label">Enter prompt:</label>
                    <input type="text" id="text_input" name="text_input" class="form-control" required>
                    
                    <input type="checkbox" id="checkbox" name="checkbox" {{ checkbox_state }}>
                    <label for="checkbox">Short answer</label>

                    <button type="submit" class="btn btn-primary mt-2 w-100">Submit</button>
                </form>
                
                <form action="/clear" method="POST">
                    <button type="submit" class="btn btn-danger">Clear chat</button>
                </form>

                <form action="/save" method="POST">
                    <button type="submit" class="btn btn-success">Save chat</button>
                </form>

                {% if chat %}
                    <div class="alert alert-success">
                        <!-- |safe tells Jinja to process the text as html -->
                        {{ chat|safe }}
                    </div>
                {% endif %}
            </main>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="renameModalLabel">Rename</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="renameForm" action="/" method="POST">
                        <input type="hidden" id="oldNameInput" name="old_name">
                        <label for="newNameInput" class="form-label">New Name:</label>
                        <input type="text" id="newNameInput" name="new_name" class="form-control" required>
                        <input type="hidden" name="action" value="rename">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="renameForm" name="action" value="rename" class="btn btn-primary">Rename</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const renameButtons = document.querySelectorAll(".rename-btn");
            renameButtons.forEach(button => {
                button.addEventListener("click", function () {
                    const oldName = this.getAttribute("data-oldname");
                    document.getElementById("oldNameInput").value = oldName;
                    document.getElementById("newNameInput").value = oldName;
                });
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
